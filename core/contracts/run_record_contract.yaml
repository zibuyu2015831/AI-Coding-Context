contract_version: 1
documents:
  generation_plan:
    required_headings:
      - "🎯 任务复杂度评估 (Complexity Assessment)"
      - "⚠️ 风险点与注意事项"
      - "🤝 交互策略 (Interaction Strategy)"
      - "📚 第三阶段：子文档规划（待审核）"
      - "📊 质量保证措施"
      - "🧾 证据与验证记录"
      - "🔎 Phase 1 方案复查清单"
  generation_progress:
    required_fields:
      - "开始时间"
      - "最后更新"
      - "当前状态"
      - "总体步骤进度"
      - "流程阶段进度"
      - "产物完成度"
      - "当前 gate"
      - "逐文档完成状态"
      - "总任务数"
      - "已完成数"
      - "下一步动作"
      - "正式生成授权"
    conditional_phase1_review_fields:
      trigger: "当 generation_progress.md 声明 Phase 1 PASS、建议通过或可进入正式文档生成时"
      required_fields:
        - "Phase 1 方案复查记录"
        - "phase1_review_verdict"
        - "review_trigger"
        - "review_started_at"
        - "review_completed_at"
        - "reviewed_files"
        - "machine_checks"
        - "manual_review_summary"
        - "writeback_summary"
        - "blocker_count"
        - "warning_count"
        - "waived_issue_count"
        - "phase1_recommendation"
        - "user_confirmation_status"
        - "formal_generation_authorization"
        - "authorization_source_summary"
      machine_checks_table:
        heading: "machine_checks"
        required_columns:
          - "phase"
          - "tool"
          - "implementation"
          - "command"
          - "exit_code"
          - "issue_count"
          - "status"
          - "required"
          - "disposition"
        required_tools:
          - "summary_validator"
          - "doc_health_checker"
          - "semantic_review_checker"
        required_tool_implementations:
          - "summary_validator:python"
          - "doc_health_checker:python"
          - "doc_health_checker:js"
          - "semantic_review_checker:python"
          - "semantic_review_checker:js"
      verdict_values:
        - "BLOCKED_NEEDS_FIX"
        - "READY_FOR_USER_REVIEW"
        - "USER_APPROVED_FORMAL_GENERATION"
  health_check_report:
    required_headings:
      - "总体结论"
      - "machine_checks"
      - "accepted_issues"
    verdict_values:
      - "PASS"
      - "PASS_WITH_ACCEPTED_ISSUES"
      - "FAIL"
    machine_checks_table:
      heading: "machine_checks"
      required_columns:
        - "round"
        - "tool"
        - "implementation"
        - "command"
        - "exit_code"
        - "issue_count"
        - "status"
        - "disposition"
      required_tool_implementations:
        - "summary_validator:python"
        - "doc_health_checker:python"
        - "doc_health_checker:js"
        - "semantic_review_checker:python"
        - "semantic_review_checker:js"
    accepted_issues_table:
      heading: "accepted_issues"
      required_columns:
        - "issue_id"
        - "tool"
        - "implementation"
        - "file"
        - "issue_type"
        - "original_status"
        - "accepted_reason"
        - "residual_risk"
        - "follow_up"
      non_waivable_issue_type_prefixes:
        - "sensitive"
        - "secret"
        - "ai_rules"
        - "runtime_stack"
        - "required_doc"
        - "doc_missing"
        - "health_report"
