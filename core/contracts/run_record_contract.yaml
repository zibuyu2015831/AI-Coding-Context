contract_version: 1
documents:
  generation_plan:
    required_headings:
      - "🎯 任务复杂度评估 (Complexity Assessment)"
      - "⚠️ 风险点与注意事项"
      - "🤝 交互策略 (Interaction Strategy)"
      - "📚 第三阶段：子文档规划（待审核）"
      - "📊 质量保证措施"
      - "🧾 证据与验证记录"
      - "🔎 Phase 1 方案复查清单"
  generation_progress:
    required_fields:
      - "开始时间"
      - "最后更新"
      - "当前状态"
      - "总体步骤进度"
      - "流程阶段进度"
      - "产物完成度"
      - "当前 gate"
      - "逐文档完成状态"
      - "总任务数"
      - "已完成数"
      - "下一步动作"
    conditional_phase1_review_fields:
      trigger: "当 generation_progress.md 声明 Phase 1 PASS、建议通过或可进入正式文档生成时"
      required_fields:
        - "Phase 1 方案复查记录"
        - "review_trigger"
        - "review_started_at"
        - "review_completed_at"
        - "reviewed_files"
        - "machine_checks"
        - "manual_review_summary"
        - "writeback_summary"
        - "blocker_count"
        - "warning_count"
        - "waived_issue_count"
        - "phase1_recommendation"
        - "user_confirmation_status"
